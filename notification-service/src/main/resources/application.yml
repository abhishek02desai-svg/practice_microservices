server:
  port: 8083

spring:
  application:
    name: notification-service
  kafka:
    # Windows host (IntelliJ): localhost:9094  |  inside Docker: kafka:9092 (set by docker-compose)
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    admin:
      operation-timeout: 5s
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest      # a NEW group starts from the oldest message; known groups continue where they stopped
      enable-auto-commit: false        # offsets are committed by Spring only AFTER the listener finished successfully
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer: a malformed message does not crash the consumer, it is sent to the dead-letter topic
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.example.notificationservice.event.OrderPlacedEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.example.notificationservice.event
    listener:
      ack-mode: record                 # commit the offset after each successfully processed record

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

app:
  kafka:
    topic:
      order-placed: order-placed
      order-placed-dlt: order-placed.DLT   # dead-letter topic for messages that could not be processed
      partitions: 3
      replicas: 1
